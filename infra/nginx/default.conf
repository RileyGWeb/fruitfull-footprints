# Snapshot of what this app owns inside the shared host's single
# /opt/apps/nginx/conf.d/default.conf (and conf.d.final/default.conf — kept identical, see
# README.md's dual-write gotcha). Not the whole file — every other app's server blocks live in the
# same file and aren't shown here. Live since 2026-10-29 (cert issued, verified with
# nginx/verify.sh).

# This app's domain is one entry in the single shared HTTP(80) block's server_name list (shared
# with every other app on the host, so only the one line is ours):
#
#   server {
#       listen 80;
#       server_name ... fruitfullfootprints.club www.fruitfullfootprints.club ...;
#       location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
#       location / { return 301 https://$host$request_uri; }
#   }

server {
    listen 443 ssl;
    http2 on;
    server_name fruitfullfootprints.club www.fruitfullfootprints.club;
    resolver 127.0.0.11 valid=10s;
    ssl_certificate     /etc/letsencrypt/live/fruitfullfootprints.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fruitfullfootprints.club/privkey.pem;

    # nginx owns /api directly (FastCGI straight to php-fpm) — Next's own rewrites() for /api
    # never fires in this deployment, see ../README.md "Topology". HTTP_X_FORWARDED_FOR is set
    # explicitly (most apps on this host don't need it) because the unlock rate limit keys on the
    # real client IP — backend/config/trustedproxy.php must trust this nginx's network for it to
    # be honored (TRUSTED_PROXIES=172.18.0.0/16 in the production secret, not `*`).
    location ~ ^/(api) {
        set $backend fruitfull-backend;
        fastcgi_pass $backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        include fastcgi_params;
    }

    location / {
        set $upstream fruitfull-frontend;
        proxy_pass http://$upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
